
<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap');
        
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            transition: all 0.7s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .glass {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }


        .bg-clear { background: linear-gradient(135deg, #FF9966, #FF5E62); }
        .bg-clouds { background: linear-gradient(135deg, #5D6D7E, #2C3E50); }
        .bg-rain { background: linear-gradient(135deg, #4B79A1, #283E51); }
        .bg-snow { background: linear-gradient(135deg, #E6DADA, #274046); }
        .bg-default { background: linear-gradient(135deg, #4facfe, #00f2fe); }

        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.3); border-radius: 10px; }
    </style>
</head>

<!-- Tepadagi qism : Search change Mode -->
<body class="bg-default min-h-screen flex items-center justify-center p-4 md:p-6 text-white">

    <div class="max-w-5xl w-full space-y-6">
        
        <header class="flex flex-col md:flex-row gap-4 items-center justify-between">
            <div class="relative w-full md:max-w-md group">
                <i class="fas fa-search absolute left-4 top-1/2 -translate-y-1/2 text-white/50 group-focus-within:text-white transition-colors"></i>
                <input type="text" id="citySearch" 
                    placeholder="Shaharni kiriting..." 
                    class="w-full bg-white/10 border border-white/20 rounded-2xl py-4 pl-12 pr-4 outline-none focus:bg-white/20 focus:border-white/40 transition-all placeholder:text-white/40">
            </div>
            
            <div class="flex items-center gap-3">
                <button onclick="handleSearch()" class="bg-white text-gray-900 px-8 py-4 rounded-2xl font-bold hover:scale-105 active:scale-95 transition-all shadow-xl">
                    Qidirish
                </button>
                <button id="toggleUnit" class="glass px-6 py-4 rounded-2xl font-bold hover:bg-white/20 transition-all">
                    °C
                </button>
            </div>
        </header>
        <!-- Loading qismi -->
        <div id="loadingState" class="hidden py-20 text-center animate-pulse">
            <i class="fas fa-spinner fa-spin text-5xl mb-4"></i>
            <p class="text-xl font-medium">Ob-havo ma'lumotlari yangilanmoqda...</p>
        </div>
<!-- Natija -->
        <main id="mainDashboard" class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            
            <section class="lg:col-span-2 glass rounded-[2.5rem] p-8 md:p-12 relative overflow-hidden shadow-2xl">
                <div class="relative z-10">
                    <div class="flex justify-between items-start">
                        <div>
                            <h2 id="displayCity" class="text-4xl md:text-6xl font-bold tracking-tight">--</h2>
                            <p id="displayDate" class="text-white/70 mt-2 text-lg font-medium italic">--</p>
                        </div>
                        <div id="mainIcon" class="text-7xl md:text-9xl opacity-90 drop-shadow-2xl">
                            <i class="fas fa-sun"></i>
                        </div>
                    </div>
                    <!-- -- Asosiy ob-havo ma'lumotlari -- -->
                    <div class="mt-16 flex flex-wrap items-end gap-8">
                        <div id="displayTemp" class="text-8xl md:text-[10rem] font-bold leading-none tracking-tighter">--°</div>
                        <div class="mb-4">
                            <p id="displayCondition" class="text-2xl md:text-3xl font-semibold capitalize tracking-wide">--</p>
                            <p id="displayRange" class="text-white/60 mt-1 font-medium italic">Sezilarli: --</p>
                        </div>
                    </div>
                    <!-- Qo'shimcha ma'lumotlar -->
                    <div class="grid grid-cols-3 gap-4 mt-16 pt-8 border-t border-white/10">
                        <div class="text-center group">
                            <i class="fas fa-droplet text-white/40 mb-2 group-hover:text-blue-300 transition-colors"></i>
                            <p class="text-xs uppercase tracking-widest text-white/50">Namlik</p>
                            <p id="displayHumidity" class="text-xl font-bold">--%</p>
                        </div>
                        <div class="text-center group">
                            <i class="fas fa-wind text-white/40 mb-2 group-hover:text-teal-300 transition-colors"></i>
                            <p class="text-xs uppercase tracking-widest text-white/50">Shamol</p>
                            <p id="displayWind" class="text-xl font-bold">-- m/s</p>
                        </div>
                        <div class="text-center group">
                            <i class="fas fa-gauge text-white/40 mb-2 group-hover:text-yellow-300 transition-colors"></i>
                            <p class="text-xs uppercase tracking-widest text-white/50">Bosim</p>
                            <p id="displayPressure" class="text-xl font-bold">--</p>
                        </div>
                    </div>
                </div>
            </section>
            <!-- 5 Kunlik Prognoz -->
            <section class="glass rounded-[2.5rem] p-8 shadow-2xl">
                <h3 class="text-xl font-bold mb-8 flex items-center gap-3">
                    <span class="p-2 bg-white/10 rounded-lg"><i class="fas fa-calendar-day"></i></span>
                    5 Kunlik Prognoz
                </h3>
                <div id="forecastList" class="space-y-6">
                    </div>
            </section>

        </main>
        <!-- Xatolik xabarlari -->
        <div id="errorBox" class="hidden glass border-red-500/50 bg-red-500/10 p-6 rounded-3xl text-center">
            <i class="fas fa-circle-exclamation text-3xl mb-3"></i>
            <p id="errorMessage" class="text-lg">Kechirasiz, ma'lumot olishda xatolik yuz berdi.</p>
        </div>

    </div>
    <!-- JavaScript -->
    <script src="Javascript/api.js"></script>
    <script src="Javascript/config.js"></script>
    <script src="Javascript/ui.js"></script>|

</body>
</html>
