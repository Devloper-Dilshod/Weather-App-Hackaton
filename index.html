<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-b from-blue-300 to-white min-h-screen p-10">
    <h1 class="text-center font-bold" style="font-size: 50px;">Weather-App</h1>
<div class="flex justify-center">
    <button onclick="updateTempDisplay()" class=" bg-[#f7b88b] p-2 border border-black rounded-full hover:bg-[#ffa07a]">°C ↔ °F</button>
</div>
    <div id="weatherApp" class="h-screen flex flex-col items-center transition-colors duration-500">
    <h1 id="temp" class="text-3xl font-bold mb-2 temp"></h1> <!-- Harorat -->
    <p id="desc" class="text-xl mb-4"></p> <!-- desc shu yerda bo‘ladi -->
    <button onclick="weather()" class="bg-[#f7b88b] p-2 border border-black rounded-full hover:bg-[#ffa07a]">
        Ob-havoni aniqlash
    </button>
</div>

    <script src="./script.js"></script>
</body>
</html>
